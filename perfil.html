<div class="perfil-container">

<h1 class="perfil-titulo">Mi Perfil</h1>

<p class="perfil-info"><b>Nombre:</b> <span id="nombre"></span></p>

<p class="perfil-info"><b>Correo:</b> <span id="correo"></span></p>

<p class="perfil-info"><b>Saldo disponible:</b> S/10</p>

<p class="perfil-info"><b>Ranking:</b> #25</p>

<p class="perfil-info"><b>Eventos participados:</b> 8</p>

<button class="boton-salir" onclick="cerrarSesion()">Cerrar sesión</button>

</div>

<script>

document.getElementById("nombre").innerText = localStorage.getItem("nombre");

document.getElementById("correo").innerText = localStorage.getItem("correo");

function cerrarSesion(){

localStorage.removeItem("nombre");
localStorage.removeItem("correo");

alert("Sesión cerrada");

window.location.href="login.html";

}

</script>
